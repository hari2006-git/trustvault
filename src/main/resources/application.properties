spring.application.name=TrustVault

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trustvault}
spring.datasource.username=${DB_USERNAME:trustvault_app}
spring.datasource.password=${DB_PASSWORD:change-me}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Maximum individual uploaded file: 2 GiB
spring.servlet.multipart.max-file-size=${TV_MAX_FILE_SIZE:2GB}

# Allow extra room for multipart request boundaries and headers
spring.servlet.multipart.max-request-size=${TV_MAX_REQUEST_SIZE:2050MB}

# Enforce the same limit in private file storage
trustvault.max-file-bytes=${TV_MAX_FILE_BYTES:2147483648}

# Keep uploaded multipart data on disk rather than in memory
spring.servlet.multipart.file-size-threshold=0B
trustvault.storage-path=${TV_STORAGE_PATH:./private-storage}

server.error.include-message=never
server.error.include-stacktrace=never